name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            ext: ""
          - os: macos-latest
            goos: darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X ggterm/internal/version.Version=$version -X ggterm/internal/version.Commit=$commit -X ggterm/internal/version.Date=$date" \
              -o "dist/ggterm-${{ matrix.goos }}-$arch${{ matrix.ext }}" ./cmd/ggterm
          done
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            cp "dist/ggterm-${{ matrix.goos }}-$arch" ggterm
            tar -czf "ggterm_${version}_${{ matrix.goos }}_${arch}.tar.gz" \
              ggterm README.md CHANGELOG.md docs examples
            rm -f ggterm
          done
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($arch in @('amd64', 'arm64')) {
            $stage = "stage-$arch"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "dist/ggterm-windows-$arch.exe" "$stage/ggterm.exe"
            Compress-Archive -Path "$stage/*", README.md, CHANGELOG.md, docs, examples `
              -DestinationPath "ggterm_${version}_windows_${arch}.zip"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ggterm-${{ matrix.goos }}
          path: ggterm_*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ggterm $GITHUB_REF_NAME" \
            --generate-notes
