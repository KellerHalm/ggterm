name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            ext: ""
          - os: macos-latest
            goos: darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X ggterm/internal/version.Version=$version -X ggterm/internal/version.Commit=$commit -X ggterm/internal/version.Date=$date" \
            -o "dist/ggterm${{ matrix.ext }}" ./cmd/ggterm
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "dist/ggterm" ggterm
          tar -czf "ggterm_${version}_${{ matrix.goos }}_amd64.tar.gz" \
            ggterm README.md CHANGELOG.md docs examples
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          Compress-Archive -Path dist/ggterm.exe, README.md, CHANGELOG.md, docs, examples `
            -DestinationPath "ggterm_${version}_windows_amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ggterm-${{ matrix.goos }}
          path: ggterm_*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ggterm $GITHUB_REF_NAME" \
            --generate-notes
