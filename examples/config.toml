# GoGoTerminal example configuration.
# Copy this file to <os.UserConfigDir()>/ggterm/config.toml.

[general]
session = "default"
# shell = "pwsh -NoLogo"
cols = 120
rows = 36
scrollback = 20000
restore = true
padding = 8
decorated = true

[font]
# Use the bundled Go Mono, a system family name, or a path to any font file.
family = "Go Mono"
size = 15
# path = "C:/fonts/JetBrainsMono-Regular.ttf"
# bold = "C:/fonts/JetBrainsMono-Bold.ttf"
# italic = "C:/fonts/JetBrainsMono-Italic.ttf"
# bold_italic = "C:/fonts/JetBrainsMono-BoldItalic.ttf"
# fallback = ["C:/Windows/Fonts/msyh.ttc"]  # path or a family name
ligatures = true

[window]
# Set the background alpha in [theme] (for example "#0b1020d0") to control
# opacity. The window mode is applied at startup.
transparent = false

[theme]
# Built-in: ggterm-dark, dracula, nord, gruvbox-dark, solarized-dark,
# tokyo-night, catppuccin-mocha. Use file for TOML/base16/iTerm2 schemes.
name = "ggterm-dark"
# file = "themes/base16-nord.yaml"
# background = "#0b1020"
# foreground = "#d8dee9"
# cursor = "#88c0d0c0"
# palette = ["#3b4252", "#bf616a", "#a3be8c", "#ebcb8b",
#            "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
#            "#4c566a", "#bf616a", "#a3be8c", "#ebcb8b",
#            "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4"]

[keys]
prefix = "ctrl+b"
# replace_defaults = false
# unbind = ["q"]

